version: '3.8'

services:
  # 1. Primary PostgreSQL Relational Database (No Supabase/Firebase)
  db:
    image: postgres:16-alpine
    container_name: techno_club_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: techno_user
      POSTGRES_PASSWORD: techno_secure_pass
      POSTGRES_DB: techno_club_db
    ports:
      - "5432:5432"
    volumes:
      - techno_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techno_user -d techno_club_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Enterprise Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techno_club_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://techno_user:techno_secure_pass@db:5432/techno_club_db
      - SECRET_KEY=techno-club-secret-jwt-key-for-operations-platform-2026-production
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:5173","http://localhost"]
      - UPLOAD_DIR=/app/uploads
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
    ports:
      - "8000:8000"
    volumes:
      - techno_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # 3. React Vite + Tailwind Operations UI
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: techno_club_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  techno_pgdata:
    driver: local
  techno_uploads:
    driver: local
